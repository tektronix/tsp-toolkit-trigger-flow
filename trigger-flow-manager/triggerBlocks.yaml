custom_types:
  EventList:
    description: "List of trigger events (max 4)"
    max_items: 4
    item:
      type: EventItem

  EventItem:
    description: "Single trigger event selection"
    fields:
      - name: type
        type: string
        source: trigger_events   # reuse existing event definitions

      - name: parameters
        type: dynamic            # resolved based on selected event type

  DelayList:
    description: "Delay list values as an array of positive double values in seconds"
    type: array
    item:
      type: double
      range:
        min: 0.000001
        max: 1000000

  DelayListConfig:
    description: "Configuration for per-step delay values in a modal dialog"
    modal: true
    fields:
      - name: delay_count
        type: integer
        label: "Number of Delays"
        required: true
        description: "Number of delay steps to configure"
      - name: delay_durations
        type: DelayList
        label: "Delay Duration"
        required: true
        description: "Per-point delay values. Point # is generated by row index and treated as read-only in UI."

templates:
    pulsed_sweep:
      name: "Pulsed Sweep"
      description: "Creates a pulsed source sweep with constant timing and no measurements"
      icon: pulsed_sweep
      blocks:
        - type: source action step
          block_id: pulsed_sweep_source_action_001
          block_parameters:
            trigger_block_name: pulsed_sweep_source_action_001
        - type: delay constant
          block_id: pulsed_sweep_delay_constant_001
          block_parameters:
            trigger_block_name: pulsed_sweep_delay_constant_001
        - type: source action bias
          block_id: pulsed_sweep_source_action_bias_001
          block_parameters:
            trigger_block_name: pulsed_sweep_source_action_bias_001
        - type: delay constant
          block_id: pulsed_sweep_delay_constant_002
          block_parameters:
            trigger_block_name: pulsed_sweep_delay_constant_002
        - type: counter
          block_id: pulsed_sweep_counter_001
          block_parameters:
            trigger_block_name: pulsed_sweep_counter_001
            branch_to_block_name: pulsed_sweep_source_action_001

