script_template:
  preamble: |
    -- Set up the instrument before running this script.
    -- Define aliases here
    -- e.g. local smu = slot[SLOT_INDEX].smu[CHANNEL_INDEX]

    -- If your trigger model requires TSP-Linked instruments, be sure to initialize TSP-Link here
    -- tsplink.initialize()

    -- Initialize and configure any reading buffers into which you wish to put your readings
    -- e.g. local rb = slot[SLOT_INDEX].smu[CHANNEL_INDEX].makebuffer(1000000)

    {{> begin_sentinel}}
  postamble: |
    {{> end_sentinel}}

    -- Process and/or print your data as needed after this point.
    -- e.g. printbuffer(startIndex, endIndex, buffername)
  contents: |
    -- The lines between "BEGIN GENERATED TRIGGER MODEL" and "END GENERATED TRIGGER MODEL"
    -- are machine generated and will be replaced when the trigger model is edited in the
    -- TriggerFlow UI in TSP Toolkit. Any manual changes between these two comments will
    -- be lost.

    {{#each models}}

    -- {{this.trigger_model_name}} --
    slot[{{this.slot_index}}].trigger.model.create("{{this.trigger_model_name}}")
    {{#each this.blocks}}
    {{> (lookup this "type") this.block_parameters}}

    {{/each}}
    -- IMPORTANT: Don't forget to start your trigger model by
    -- uncommenting the following line (after you complete the setup)
    -- slot[{{this.slot_index}}].trigger.model.initialize({{this.trigger_model_name}})
    {{/each}}

    -- do not remove the line below
  begin_sentinel: '-- BEGIN GENERATED TRIGGER MODEL --'
  end_sentinel: '-- END GENERATED TRIGGER MODEL --'
blocks:
  always:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        default: myTM1
        required: true
      - name: trigger_block_name
        type: string
        required: true
        default: Always
      - name: branch_to_block_name
        type: string
        required: true
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.branch.always("{{trigger_model_name}}",
      "{{trigger_block_name}}", "{{branch_to_block_name}}")
    description: >-
      When the trigger model reaches a branch-always block, it always proceeds
      to the block that you specified.
    shape: conditional
  counter:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Counter
      - name: branch_to_block_name
        type: blockReference
        required: true
      - name: target_count
        type: number
        required: true
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.branch.counter("{{trigger_model_name}}",
      "{{trigger_block_name}}", "{{branch_to_block_name}}", {{target_count}})
    description: >-
      When trigger model execution reaches a loop counter block, it goes to a
      specified block until the count value is reached.
    shape: conditional
  reset branch counter:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Reset Branch Counter
      - name: reset_branch_count_block_name
        type: string
        required: true
      - name: reset_count
        type: number
        required: true
        default: 0
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.reset.branch.counter("{{trigger_model_name}}",
      "{{trigger_block_name}}", "{{reset_branch_count_block_name}}")
    description: >-
      When this block is encountered in the trigger model, the specified branch
      counter resets to 0.
    shape: conditional
  event:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Event
      - name: branch_to_block_name
        type: string
        required: true
      - name: event_id
        type: triggerEventType
        required: true
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.branch.event("{{trigger_model_name}}",
      "{{trigger_block_name}}", "{{branch_to_block_name}}", {{event_id}})
    description: >-
      The branch-on-event block branches to a specified block when a specified
      trigger event occurs
    shape: conditional
  once:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Once
      - name: branch_to_block_name
        type: string
        required: true
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.branch.once("{{trigger_model_name}}",
      "{{trigger_block_name}}", "{{branch_to_block_name}}")
    description: >-
      When the trigger model reaches a branch-once block, it goes to a specified
      block the first time it is encountered in the trigger model.
    shape: conditional
  onceexcluded:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Once Excluded
      - name: branch_to_block_name
        type: string
        required: true
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.branch.onceexcluded("{{trigger_model_name}}",
      "{{trigger_block_name}}", "{{branch_to_block_name}}")
    description: >-
      The branch-once-excluded block branches to a specified trigger model block
      every time it is encountered in the trigger model except for the first
      time.
    shape: conditional
  config list next:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Config List NEXT
      - name: channel_index
        type: ChannelIndex
        required: true
      - name: config_list_name
        type: MultiString
        required: true
    syntax: |
      -- NOTE: The configuration list must be defined before the trigger model uses this block.
      slot[{{slot_index}}].trigger.model.addblock.configlist.next("{{trigger_model_name}}", "{{trigger_block_name}}", {{channel_index}}, "{{config_list_name}}")
    description: >-
      When trigger model execution reaches a configuration recall next block,
      the settings stored at the next index of a configuration list are
      recalled.
    shape: conditional
  configlist prev:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Config List PREV
      - name: channel_index
        type: ChannelIndex
        required: true
      - name: config_list_name
        type: string
        required: true
    syntax: |
      -- The configuration list must be defined before the trigger model uses this block.
      slot[{{slot_index}}].trigger.model.addblock.configlist.prev("{{trigger_model_name}}", "{{trigger_block_name}}", {{channel_index}}, "{{config_list_name}}")
    description: >-
      When trigger model execution reaches a configuration recall previous
      block, the settings at the previous index in the specified configuration
      list are restored.
    shape: conditional
  configlist recall:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Config List RECALL
      - name: channel_index
        type: ChannelIndex
        required: true
      - name: config_list_name
        type: string
        required: true
      - name: recall_index
        type: number
        required: false
    syntax: |
      -- The configuration list must be defined before the trigger model uses this block.
      slot[{{slot_index}}].trigger.model.addblock.configlist.recall("{{trigger_model_name}}", "{{trigger_block_name}}", {{channel_index}}, "{{config_list_name}}"{{#if recall_index}}, {{recall_index}}{{/if}})
    description: >-
      When the trigger model reaches a configuration recall block, the settings
      in the specified configuration list are recalled.
    shape: conditional
  delay constant:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Delay
      - name: delay_list
        type: DelayList
        required: true
      - name: reference_block_name
        type: string
        required: false
        range:
          min: 0.000001
          max: 1000000
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.delay.constant("{{trigger_model_name}}",
      "{{trigger_block_name}}",
      { {{#each delay_list}}{{this}}{{#unless @last}}, {{/unless}}{{/each}} },
      {{#if reference_block_name}}"{{reference_block_name}}"{{/if}})
    description: >-
      When trigger model execution reaches a delay block, it stops the trigger
      model operation for the time set by the delay.
    shape: conditional
  log_event:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        default: myTM1
        required: true
      - name: trigger_block_name
        type: string
        default: Log Event
        required: true
      - name: event_type
        type: LogEvent
        required: true
        options:
          - label: Information 1
            value: 'INFO1'
          - label: Information 2
            value: 'INFO2'
          - label: Information 3
            value: 'INFO3'
          - label: Information 4
            value: 'INFO4'
          - label: Warning 1
            value: 'WARN1'
          - label: Warning 2
            value: 'WARN2'
          - label: Warning 3
            value: 'WARN3'
          - label: Warning 4
            value: 'WARN4'
          - label: Error 1
            value: 'ERROR1'
          - label: Error 2
            value: 'ERROR2'
          - label: Error 3
            value: 'ERROR3'
          - label: Error 4
            value: 'ERROR4'
          - label: Abort
            value: 'WARN_ABORT'
      - name: event_message
        type: string
        required: true
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.logevent("{{trigger_model_name}}",
      "{{trigger_block_name}}",
      slot[{{slot_index}}].trigger.model.LOG_{{event_type}},
      "{{event_message}}")
    description: >-
      The log event block allows you to log an event in the event log when
      trigger model execution reaches this block.
    shape: conditional
  measure:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Measure
      - name: channel_list
        type: ChannelList
        required: true
      - name: measure_count
        type: number
        required: false
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.measure("{{trigger_model_name}}",
      "{{trigger_block_name}}",
      { {{#each channel_list}}{{this}}{{#unless @last}}, {{/unless}}{{/each}} }
      {{#if measure_count}}, {{measure_count}}{{/if}})
    description: >-
      The measure block triggers measurements based on the measurement function
      that is selected when the trigger model is initiated.
    shape: conditional
  measure overlapped:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Measure Overlapped
      - name: channel_list
        type: ChannelList
        required: true
      - name: measure_count
        type: number
        required: false
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.measureoverlapped("{{trigger_model_name}}",
      "{{trigger_block_name}}",
      { {{#each channel_list}}{{this}}{{#unless @last}}, {{/unless}}{{/each}} }
      {{#if measure_count}}, {{measure_count}}{{/if}})
    description: >-
      The measure overlapped block starts a measurement in an overlap state (in
      the background), allowing the trigger model to continue execution without
      waiting for the measurement to complete.
    shape: conditional
  no operation:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: NOP
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.nop("{{trigger_model_name}}",
      "{{trigger_block_name}}")
    description: >-
      The no operation block acts as a placeholder in a trigger model. No action
      is taken when this block is executed.
    shape: conditional
  notify:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Notify
      - name: event_id
        type: notifyType
        required: true
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.notify("{{trigger_model_name}}",
      "{{trigger_block_name}}", {{event_id}})
    description: The notify block generates a trigger event in the system.
    shape: conditional
  source action bias:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Source Action BIAS
      - name: channel_list
        type: ChannelList
        required: true
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.source.action.bias("{{trigger_model_name}}",
      "{{trigger_block_name}}",
      { {{#each channel_list}}{{this}}{{#unless @last}}, {{/unless}}{{/each}} })
    description: >-
      The source action bias block sets the source output level to the bias
      level set before the start of the trigger model.
    shape: conditional
  source action set:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Source Action SET
      - name: channel_list
        type: ChannelList
        required: true
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.source.action.set("{{trigger_model_name}}",
      "{{trigger_block_name}}",
      { {{#each channel_list}}{{this}}{{#unless @last}}, {{/unless}}{{/each}} })
    description: >-
      The source action set block sets the source output level to the value at
      the present index in the list of sweep values without advancing the index.
    shape: conditional
  source action skip:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Source Action SKIP
      - name: channel_list
        type: ChannelList
        required: true
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.source.action.skip("{{trigger_model_name}}",
      "{{trigger_block_name}}",
      { {{#each channel_list}}{{this}}{{#unless @last}}, {{/unless}}{{/each}} })
    description: >-
      The source action skip block advances the index in the list of sweep
      values with no change to the source level.
    shape: conditional
  source action step:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Source Action STEP
      - name: channel_list
        type: ChannelList
        required: true
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.source.action.step("{{trigger_model_name}}",
      "{{trigger_block_name}}",
      { {{#each channel_list}}{{this}}{{#unless @last}}, {{/unless}}{{/each}} })
    description: >-
      The source action step block advances the index in the list of sweep
      values for the specified channel and then sets the source value to the
      value at that index.
    shape: conditional
  source output:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Source OUTPUT
      - name: channel_list
        type: ChannelList
        required: true
      - name: state
        type: SourceState
        required: true
        options:
          - label: 'ON'
            value: 'ON'
          - label: 'OFF'
            value: 'OFF'
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.source.output("{{trigger_model_name}}",
      "{{trigger_block_name}}",
      { {{#each channel_list}}{{this}}{{#unless @last}}, {{/unless}}{{/each}} },
      {{state}})
    description: The source output block turns the output of the source on or off.
    shape: conditional
  wait:
    parameters:
      - name: slot_index
        type: SlotIndex
        required: true
      - name: trigger_model_name
        type: string
        required: true
        default: myTM1
      - name: trigger_block_name
        type: string
        required: true
        default: Wait
      - name: event0
        type: triggerEventType
        required: true
      - name: event1
        type: triggerEventType
        required: false
      - name: event2
        type: triggerEventType
        required: false
      - name: event3
        type: triggerEventType
        required: false
      - name: clear
        type: ClearType
        required: false
        options:
          - label: Enter
            value: ENTER
          - label: Never
            value: NEVER
      - name: logic
        type: LogicType
        required: false
        options:
          - label: AND
            value: AND
          - label: OR
            value: OR
    syntax: >-
      slot[{{slot_index}}].trigger.model.addblock.wait("{{trigger_model_name}}",
      "{{trigger_block_name}}",
      {{event0}}
      {{#if clear}}, slot[{{slot_index}}].trigger.model.CLEAR_{{clear}}
      {{#if logic}}, slot[{{slot_index}}].trigger.model.WAIT_{{logic}}
      {{#if event1}}, {{event1}}
      {{#if event2}}, {{event2}}
      {{#if event3}}, {{event3}}
      {{/if}}
      {{/if}}
      {{/if}}
      {{/if}}
      {{/if}}
      )
    description: >-
      The wait block causes the trigger model to stop and wait for an event or
      set of events to occur before continuing.
    shape: conditional

