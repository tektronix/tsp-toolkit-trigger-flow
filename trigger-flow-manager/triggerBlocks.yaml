templates:
    pulsed_sweep:
      name: "Pulsed Sweep"
      description: "Creates a pulsed source sweep with constant timing and no measurements"
      icon: pulsed_sweep
      blocks:
        - type: source action step
          block_id: pulsed_sweep_source_action_001
          block_parameters:
            trigger_block_name: pulsed_sweep_source_action_001
        - type: delay constant
          block_id: pulsed_sweep_delay_constant_001
          block_parameters:
            trigger_block_name: pulsed_sweep_delay_constant_001
        - type: source action bias
          block_id: pulsed_sweep_source_action_bias_001
          block_parameters:
            trigger_block_name: pulsed_sweep_source_action_bias_001
        - type: delay constant
          block_id: pulsed_sweep_delay_constant_002
          block_parameters:
            trigger_block_name: pulsed_sweep_delay_constant_002
        - type: counter
          block_id: pulsed_sweep_counter_001
          block_parameters:
            trigger_block_name: pulsed_sweep_counter_001
            branch_to_block_name: pulsed_sweep_source_action_001

