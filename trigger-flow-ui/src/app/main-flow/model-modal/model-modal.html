<div class="tf-modal-backdrop" *ngIf="open">
  <section class="tf-modal" role="dialog" aria-modal="true" aria-label="New Model">
    <header class="tf-modal__header">
      <h2>New Model</h2>
      <button type="button" class="icon-btn" (click)="onClose()" aria-label="Close">
        <img class="icon-img" src="assets/shapes/Icons/X.svg" alt="Close" />
      </button>
    </header>
    
    <div class="tf-modal__body">
      
      <!-- dedicated divider under header -->
      <div class="tf-modal__divider tf-modal__divider--header"></div>

      <app-textbox label="Name" [(ngModel)]="name"></app-textbox>

      <app-dropdown
        label="Slot"
        [options]="slotOptionsAsString"
        [(ngModel)]="slotValue">
      </app-dropdown>

      <!-- <app-dropdown
        label="Channel"
        [options]="channelOptionsAsString"
        [(ngModel)]="channelValue">
      </app-dropdown>

      <app-dropdown
        label="Node"
        [options]="nodeOptionsAsString"
        [(ngModel)]="nodeValue">
      </app-dropdown> -->

      <app-textbox label="Notes" [(ngModel)]="notes"></app-textbox>

      <!-- dedicated divider under notes -->
      <div class="tf-modal__divider tf-modal__divider--notes"></div>
      <!-- <div class="tf-modal__divider"></div> -->

      <div class="tf-modal__footer-icons">
        <button type="button" class="icon-btn" (click)="onCopy()" aria-label="Copy">
          <img class="icon-img" src="assets/shapes/Icons/Copy.svg" alt="Copy" />
        </button>
        <button type="button" class="icon-btn" (click)="onDelete()" aria-label="Delete">
          <img class="icon-img" src="assets/shapes/Icons/Trash.svg" alt="Delete" />
        </button>
      </div>
    </div>
  </section>
</div>
