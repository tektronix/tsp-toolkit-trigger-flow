@if (open) {
  <div class="tf-modal-backdrop">
    <section class="tf-modal tf-delay-list-modal" role="dialog" aria-modal="true" aria-label="Delay List">
      <header class="tf-modal__header">
        <h2>Delay List</h2>
        <button type="button" class="icon-btn" (click)="onCancel()" aria-label="Close delay list dialog" automationID="Button-Close-Delay-List" title="Close">
          <img class="icon-img" src="assets/shapes/Icons/X.svg" alt="Close" />
        </button>
      </header>

      <div class="tf-modal__body">
        <div class="tf-modal__divider tf-modal__divider--header"></div>

        <app-textbox
          label="Number of Delays"
          [ngModel]="getLocalDelayCountAsText()"
          (inputChange)="onDelayCountChange($event)"
          [invalid]="!!delayCountError"
          [errorMessage]="delayCountError"
          automationID="Input-Number-Of-Delays"
        />

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Index #</th>
                <th>Delay Duration</th>
              </tr>
            </thead>
            <tbody>
              @for (value of localDelayDurations; track $index; let rowIndex = $index) {
                <tr>
                  <td>{{ rowIndex + 1 }}</td>
                  <td class="delay-cell">
                    <app-input-numeric
                      class="delay-input"
                      [label]="''"
                      [unit]="'s'"
                      [floatAllowed]="true"
                      [ngModel]="getDelayDuration(rowIndex)"
                      (inputChange)="onDelayDurationChange(rowIndex, $event)"
                      [attr.aria-label]="'Delay duration for row ' + (rowIndex + 1)"
                      [automationID]="'Input-Delay-Duration-' + (rowIndex + 1)"
                    />
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>

        <div class="tf-modal__actions">
          <button type="button" class="btn ghost" (click)="onCancel()" automationID="Button-Cancel-Delay-List" title="Cancel">Cancel</button>
          <button type="button" class="btn primary" (click)="onApply()" automationID="Button-Apply-Delay-List" title="Apply">Apply</button>
        </div>
      </div>
    </section>
  </div>
}
