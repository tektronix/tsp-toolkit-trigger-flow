<div class="main-flow-container">
  <aside class="palette-sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="collapse-btn-header">
      <!-- Left button group -->
      <div class="header-left-buttons">
        <button
          [attr.aria-label]="'ModelSettings'"
          class="action-btn"
          (click)="addNewTriggerModel()"
          title="Model Settings"
        >
          Model Settings
        </button>
        <button
          [attr.aria-label]="'OpenScript'"
          class="action-btn"
          (click)="openScript()"
          title="Open Script"
        >
          Open Script
        </button>
      </div>

      <!-- Collapse button on right -->
      <button class="collapse-btn" (click)="toggleSidebar()">
        <mat-icon>{{ sidebarCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
      </button>
    </div>
    <div>
      @if (!sidebarCollapsed) {
        <app-side-panel-accordion></app-side-panel-accordion>
      }
    </div>
  </aside>
  <main class="canvas-area">
    <app-canvas (requestModelModal)="onRequestModelModal($event)"></app-canvas>

    <app-model-modal
      [open]="showModelModal"
      [name]="modelName"
      [slot]="modelSlot"
      [notes]="modelNotes"
      [slotOptions]="slotOptions"
      (slotChanged)="onModelModalSlotChanged($event)"
      (closeWithValue)="onModelModalClose($event)"
      (deleteClicked)="onModelModalDelete()"
      (copyClicked)="onModelModalCopy()">
    </app-model-modal>
  </main>
  <aside class="parameters-sidebar">
    <div class="parameters-box">
      <h3>Block Parameters</h3>
      <app-block-parameters></app-block-parameters>
    </div>
  </aside>
</div>
