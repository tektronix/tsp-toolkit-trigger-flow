<div class="main-flow-container">
  <aside class="palette-sidebar" [class.collapsed]="sidebarCollapsed" [attr.aria-label]="'Left-panel'">
    <div class="collapse-btn-header">
      <!-- Left button group -->
      <div class="header-left-buttons">
        <button
          [attr.aria-label]="'ModelSettings'"
          class="action-btn"
          (click)="openModelSettings()"
          title="Model Settings"
        >
          Model Settings
        </button>
        <button
          [attr.aria-label]="'OpenScript'"
          class="action-btn"
          (click)="openScript()"
          title="Open Script"
        >
          Open Script
        </button>
      </div>

      <!-- Collapse button on right -->
      <button class="collapse-btn" (click)="toggleSidebar()" [attr.aria-label]="'left-panel-collapse-button'" title="{{sidebarCollapsed ? 'Show Panel' : 'Hide Panel'}}">
        <mat-icon>{{ sidebarCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
      </button>
    </div>
    <div>
      @if (!sidebarCollapsed) {
        <app-side-panel-accordion></app-side-panel-accordion>
      }
    </div>
  </aside>
  <main class="canvas-area">
    <app-canvas (requestModelModal)="onRequestModelModal($event)"></app-canvas>

    <app-model-modal
      [open]="showModelModal"
      [name]="modelName"
      [existingModelNames]="existingModelNames"
      [slot]="modelSlot"
      [nodeId]="modelNodeId"
      [notes]="modelNotes"
      [slotOptions]="slotOptions()"
      (slotChanged)="onModelModalSlotChanged($event)"
      (closeWithValue)="onModelModalClose($event)"
      (deleteClicked)="onModelModalDelete()"
      (copyClicked)="onModelModalCopy()">
    </app-model-modal>

    <app-model-settings-modal
      [open]="showModelSettingsModal"
      [models]="modelSettingsList"
      [maxModels]="modelSettingsMaxModels"
      (close)="closeModelSettings()"
      (addModel)="onAddModelFromSettings()"
      (deleteModel)="onDeleteModel($event)"
      (editModel)="onEditModel($event)">
    </app-model-settings-modal>

    <app-edit-model-modal
      [open]="showEditModelModal"
      [modelName]="editingModelName()"
      [currentSlot]="editingSlot()"
      [currentNodeId]="editingNodeId()"
      [slotOptions]="editingSlotOptions()"
      [invalidCurrentLabel]="editingInvalidLabel()"
      (save)="onEditModelSave($event)"
      (closed)="onEditModelCancel()">
    </app-edit-model-modal>
  </main>
  <aside
    class="parameters-sidebar"
    [class.collapsed]="parametersCollapsed"
    [attr.aria-label]="'Block-parameters-sidebar'"
  >
    <div class="collapse-btn-header parameters-collapse-header">
      <button
        class="parameters-collapse-btn"
        (click)="toggleParametersSidebar()"
        [attr.aria-label]="'right-panel-collapse-button'"
        title="{{ parametersCollapsed ? 'Show Panel' : 'Hide Panel' }}"
      >
        <mat-icon>{{ parametersCollapsed ? 'chevron_left' : 'chevron_right' }}</mat-icon>
      </button>
    </div>
    @if (!parametersCollapsed) {
      <app-block-parameters></app-block-parameters>
    }
  </aside>
</div>
