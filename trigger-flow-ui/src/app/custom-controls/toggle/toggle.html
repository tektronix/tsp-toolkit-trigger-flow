<div class="toggle-container">
  <span *ngIf="label" class="toggle-label">{{ label }}</span>
  
  <!-- Display currently selected option outside toggle -->
  <span class="selected-option-label">{{ selectedOption }}</span>
  
  <div class="toggle-options-box">
    <div class="toggle-switch" [attr.aria-label]="automationID" [class.disabled]="disabled" (click)="!disabled && toggleOption(selectedOption === options[0] ? options[1] : options[0])">
      <div class="toggle-track">
        <div class="toggle-thumb" [class.active]="selectedOption === options[1]"></div>
      </div>
    </div>
  </div>
</div>
