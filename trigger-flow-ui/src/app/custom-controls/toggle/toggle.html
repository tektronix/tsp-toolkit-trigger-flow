<div class="toggle-container">
  @if (label) {
    <span class="toggle-label">{{ label }}</span>
  }

  <button
    type="button"
    class="toggle-switch"
    role="switch"
    [attr.aria-label]="automationID || label || 'toggle switch'"
    [attr.aria-checked]="selectedOption === options[0]"
    [class.on]="selectedOption === options[0]"
    [disabled]="disabled"
    (click)="toggleOption(selectedOption === options[0] ? options[1] : options[0])"
  >
    <span class="toggle-track">
      <span class="toggle-thumb"></span>
    </span>
  </button>

  <span class="selected-option-label">{{ selectedOption }}</span>
</div>
