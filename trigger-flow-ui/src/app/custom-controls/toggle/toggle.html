<div class="toggle-container">
  @if (label) {
    <span class="toggle-label">{{ label }}</span>
  }

  <div class="toggle-row">
    <button
      type="button"
      class="toggle-switch"
      role="switch"
      [attr.aria-label]="automationID"
      [attr.aria-checked]="isOn"
      [class.on]="isOn"
      [disabled]="disabled"
      (click)="toggleOption(isOn ? offOption?.value : onOption?.value)"
    >
      <span class="toggle-track">
        <span class="toggle-thumb"></span>
      </span>
    </button>

    <span class="selected-option-label">{{ selectedOptionLabel }}</span>
  </div>
</div>
