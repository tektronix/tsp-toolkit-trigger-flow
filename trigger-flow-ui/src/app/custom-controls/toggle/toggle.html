<div class="toggle-container">
  <span *ngIf="label" class="toggle-label">{{ label }}</span>
  
  <!-- Display currently selected option outside toggle -->
  <span class="selected-option-label">{{ selectedOption }}</span>
  
  <div class="toggle-options-box">
    <table [attr.aria-label]="automationID">
      <tr>
        <td
          *ngFor="let option of options; let i = index"
          class="toggle-option"
          [class.selected]="option === selectedOption"
          [class.disabled]="disabled"
          [attr.aria-label]="option + '1'"
          (click)="toggleOption(option)"
        >
          <!-- Show index/icon instead of option text -->
          {{ i + 1 }}
        </td>
      </tr>
    </table>
  </div>
</div>
