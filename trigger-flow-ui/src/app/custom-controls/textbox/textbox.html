<div class="textbox">
  <label for="input">{{ label }}</label>
  <input
    [attr.aria-label]="automationID"
    type="text"
    [value]="value"
    (blur)="onBlur($event)"
    (keydown)="onKeyDown($event)"
    [disabled]="disabled"
    [class.textbox--error]="invalid"
  />

  <div *ngIf="invalid && errorMessage" class="textbox__error">
    {{ errorMessage }}
  </div>
</div>
