<div class="textbox">
  <label for="input">{{ label }}</label>
  <input
    [attr.aria-label]="automationID"
    type="text"
    [value]="value"
    (input)="onInputChange($event)"
    (blur)="onBlur($event)"
    (keydown)="onKeyDown($event)"
    [disabled]="disabled"
    [class.textbox--error]="invalid"
  />

  @if (invalid && errorMessage) {
    <div class="textbox__error">
      {{ errorMessage }}
    </div>
  }
</div>
