<div class="radio-container">
  <label class="radio-label">

    <input
      type="radio"
      class="radio-input"
      [name]="name"
      [value]="value"
      [checked]="checked"
      [disabled]="disabled"
      [attr.aria-label]="disabled ? automationID + '-Disabled' : automationID"
      [attr.automationID]="disabled ? automationID + '-Disabled' : automationID"
      (change)="onRadioChange()"
      (blur)="onBlur()"
    />

    <span class="radio-text">
      {{ label }}
    </span>

  </label>
</div>
