<div class="dropdown">
  <label for="dropdown">{{ label }}</label>
  <select
    [attr.aria-label]="label + ' dropdown'"
    [value]="selected"
    (change)="onSelectionChanged($event)"
    [disabled]="disabled"
  >
    @for (option of options; track option) {
      <option [value]="option" [selected]="option === selected" [attr.automationID]="'option' + '-' + option" [attr.aria-label]="'option-' + option">
        {{ option }}
      </option>
    }
  </select>
</div>
