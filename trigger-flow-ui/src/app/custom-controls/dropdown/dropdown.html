<div class="dropdown">
  <label for="dropdown">{{ label }}</label>
  <select
    [attr.aria-label]="automationID"
    [value]="selected"
    (change)="onSelectionChanged($event)"
    [disabled]="disabled"
  >
    @for (option of options; track option) {
      <option [value]="option">
        {{ option }}
      </option>
    }
  </select>
</div>
