<div class="checkbox-group">
  @if (label) {
    <span class="checkbox-group-label">{{ label }}</span>
  }
  <div class="checkbox-group-options">
    @for (option of options; track option.value) {
      <label class="checkbox-group-item">
        <input
          type="checkbox"
          class="checkbox-group-input"
          [attr.aria-label]="automationID"
          [checked]="isChecked(option.value)"
          [disabled]="disabled || option.disabled"
          (change)="onCheckboxChange($event, option.value)"
          (blur)="onBlur()"
        />
        <span class="checkbox-group-text">{{ option.label }}</span>
      </label>
    }
  </div>
</div>
