<div class="radio-group">
  @if (label) {
    <span class="radio-group-label">
      {{ label }}
    </span>
  }

  <div class="radio-group-options">

    @for (option of options; track option) {

      @let normalized = getNormalizedOption(option);

      <label class="radio-group-item">
        <input
          type="radio"
          class="radio-group-input"
          [name]="name"
          [value]="normalized.value"
          [attr.aria-label]="automationID"
          [checked]="selectedValue === normalized.value"
          [disabled]="disabled || !!normalized.disabled"
          (change)="onRadioChange($event)"
        />

        <span class="radio-group-text">
          {{ normalized.label }}
        </span>

      </label>
    }
  </div>
</div>
