<div class="input-numeric">
  <label for="input">{{ label }}</label>
  <input
    [attr.aria-label]="automationID"
    [type]="unit ? 'text' : 'number'"
    [attr.inputmode]="floatAllowed ? 'decimal' : 'numeric'"
    [value]="displayValue"
    (blur)="onBlur($event)"
    (keydown)="onKeyDown($event)"
    [disabled]="disabled"
  />
</div>
